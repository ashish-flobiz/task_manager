
    

      <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <h1 class="font-bold text-xl justify-center flex">{{isEditMode ? "Edit Task" : "Add Task"}}</h1>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm" >
    <form action="#" class="space-y-6" (ngSubmit)="saveTask()" >
      <div>
        <label for="Title" class="block text-sm/6 font-medium text-gray-900">Title</label>
        <div class="mt-2">
          <input [(ngModel)] = "task.title" type="text" name="title" class="w-[calc(100%-120px)] text-md border border-gray-300 rounded-md p-2" placeholder="Enter the task title" />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label for="Description" class="block text-sm/6 font-medium text-gray-900">Description</label>
          
        </div>
        <div class="mt-2">
        <textarea [(ngModel)] = "task.description" name="description" type="text" class="w-[calc(100%-120px)] text-md border border-gray-300 rounded-md p-2" placeholder="Enter your task description" ></textarea>

        </div>
      </div>

      <div>
        <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 cursor-pointer" > {{isEditMode ? "Update Task" : "Add Task"}}</button>
      </div>
    </form>

  </div>
</div>
